<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Dashboard - Hệ Thống Tự Học AI UNETI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .card-label {
            color: #999;
            font-size: 13px;
        }

        .card.learning {
            border-left-color: #f093fb;
        }

        .card.usage {
            border-left-color: #4facfe;
        }

        .card.category {
            border-left-color: #43e97b;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            color: #666;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
            font-size: 13px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.learning {
            background: #f0f4ff;
            color: #667eea;
        }

        .badge.initial {
            background: #f0fff4;
            color: #43e97b;
        }

        .badge.category-hocphi {
            background: #fff7ed;
            color: #ff9a56;
        }

        .badge.category-dao-tao {
            background: #eef5ff;
            color: #2196f3;
        }

        .badge.category-thu-tuc {
            background: #f3e5f5;
            color: #9c27b0;
        }

        .badge.category-lien-he {
            background: #fef5e7;
            color: #f39c12;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 13px;
            color: #999;
            margin-top: 5px;
        }

        .category-chart {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .category-item {
            padding: 15px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        .category-item h4 {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .category-item .count {
            font-size: 32px;
            font-weight: bold;
        }

        .category-hocphi { background: linear-gradient(135deg, #ff9a56 0%, #ff7a4d 100%); }
        .category-dao-tao { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .category-thu-tuc { background: linear-gradient(135deg, #9c27b0 0%, #d946a6 100%); }
        .category-lien-he { background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); }
        .category-general { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Hệ Thống Tự Học AI UNETI</h1>
            <p class="subtitle">Theo dõi hiệu suất Knowledge Base và Auto-Learning</p>
        </div>

        <button class="refresh-btn" onclick="loadStats()">🔄 Tải lại dữ liệu</button>

        <!-- MAIN STATS -->
        <div class="grid" id="mainStats">
            <div class="loading">
                <div class="spinner"></div>
                Đang tải dữ liệu...
            </div>
        </div>

        <!-- KNOWLEDGE BASE STATS -->
        <div class="section">
            <h2>📚 Thống Kê Knowledge Base</h2>
            <div id="kbStats" class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- LEARNING STATS -->
        <div class="section">
            <h2>🧠 Thống Kê Tự Học</h2>
            <div id="learningStats" class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- TOP QUESTIONS -->
        <div class="section">
            <h2>⭐ Top 5 Câu Hỏi Thường Gặp</h2>
            <div id="topQuestions" class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- CATEGORY DISTRIBUTION -->
        <div class="section">
            <h2>🏷️ Phân Bố Theo Danh Mục</h2>
            <div id="categories" class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) throw new Error('Failed to fetch stats');
                const stats = await response.json();

                // Main stats
                const mainStatsHTML = `
                    <div class="card">
                        <h3>📊 Tổng Câu Hỏi</h3>
                        <div class="card-value">${stats.knowledgeBase.totalQA}</div>
                        <div class="card-label">trong Knowledge Base</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min((stats.knowledgeBase.totalQA / 50) * 100, 100)}%"></div>
                        </div>
                    </div>

                    <div class="card learning">
                        <h3>🧠 Tự Học Được</h3>
                        <div class="card-value">${stats.learning.autoLearned}</div>
                        <div class="card-label">từ API Gemini</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min((stats.learning.autoLearned / stats.knowledgeBase.totalQA * 100) || 0, 100)}%"></div>
                        </div>
                    </div>

                    <div class="card usage">
                        <h3>📈 Tổng Lượt Sử Dụng</h3>
                        <div class="card-value">${stats.learning.totalUsage}</div>
                        <div class="card-label">trung bình ${stats.learning.averageUsage} lần/câu</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min((stats.learning.averageUsage / 5) * 100, 100)}%"></div>
                        </div>
                    </div>

                    <div class="card category">
                        <h3>🔗 Sessions Hoạt Động</h3>
                        <div class="card-value">${stats.activeSessions}</div>
                        <div class="card-label">cuộc trò chuyện cùng lúc</div>
                    </div>
                `;
                document.getElementById('mainStats').innerHTML = mainStatsHTML;

                // KB Stats
                const kbStatsHTML = `
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value">${stats.knowledgeBase.totalQA}</div>
                            <div class="stat-label">Tổng Q&A</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.knowledgeBase.categories['học phí'] || 0}</div>
                            <div class="stat-label">Học Phí</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.knowledgeBase.categories['đào tạo'] || 0}</div>
                            <div class="stat-label">Đào Tạo</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.knowledgeBase.categories['thủ tục'] || 0}</div>
                            <div class="stat-label">Thủ Tục</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.knowledgeBase.categories['liên hệ'] || 0}</div>
                            <div class="stat-label">Liên Hệ</div>
                        </div>
                    </div>
                `;
                document.getElementById('kbStats').innerHTML = kbStatsHTML;

                // Learning Stats
                const learningHTML = `
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value">${stats.learning.autoLearned}</div>
                            <div class="stat-label">Tự Học Được</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.learning.initialTraining}</div>
                            <div class="stat-label">Training Ban Đầu</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.learning.totalUsage}</div>
                            <div class="stat-label">Tổng Lần Dùng</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${stats.learning.averageUsage}</div>
                            <div class="stat-label">Trung Bình/Câu</div>
                        </div>
                    </div>
                    <p style="color: #999; font-size: 13px; margin-top: 20px;">
                        <strong>💡 Tip:</strong> Hệ thống sẽ tự động lưu các câu hỏi mới và câu trả lời từ Gemini để tránh gọi API không cần thiết lần sau.
                    </p>
                `;
                document.getElementById('learningStats').innerHTML = learningHTML;

                // Top Questions
                if (stats.topQuestions && stats.topQuestions.length > 0) {
                    let topHTML = '<table><tr><th>Câu Hỏi</th><th>Lần Dùng</th><th>Category</th></tr>';
                    stats.topQuestions.forEach(q => {
                        topHTML += `
                            <tr>
                                <td>${q.question.substring(0, 60)}...</td>
                                <td><strong>${q.frequency}</strong></td>
                                <td><span class="badge badge-${q.category}">${q.category}</span></td>
                            </tr>
                        `;
                    });
                    topHTML += '</table>';
                    document.getElementById('topQuestions').innerHTML = topHTML;
                } else {
                    document.getElementById('topQuestions').innerHTML = '<div class="empty">Chưa có dữ liệu</div>';
                }

                // Categories
                const catHTML = `
                    <div class="category-chart">
                        <div class="category-item category-hocphi">
                            <h4>💰 Học Phí</h4>
                            <div class="count">${stats.knowledgeBase.categories['học phí'] || 0}</div>
                        </div>
                        <div class="category-item category-dao-tao">
                            <h4>📚 Đào Tạo</h4>
                            <div class="count">${stats.knowledgeBase.categories['đào tạo'] || 0}</div>
                        </div>
                        <div class="category-item category-thu-tuc">
                            <h4>📋 Thủ Tục</h4>
                            <div class="count">${stats.knowledgeBase.categories['thủ tục'] || 0}</div>
                        </div>
                        <div class="category-item category-lien-he">
                            <h4>📞 Liên Hệ</h4>
                            <div class="count">${stats.knowledgeBase.categories['liên hệ'] || 0}</div>
                        </div>
                    </div>
                `;
                document.getElementById('categories').innerHTML = catHTML;

            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('mainStats').innerHTML = '<div class="empty">❌ Lỗi khi tải dữ liệu</div>';
            }
        }

        // Load stats on page load
        loadStats();

        // Auto-refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
